# =====================
# ✅ Performance Tweaks
# =====================

# Enable the Gradle Daemon (keeps Gradle running in memory between builds)
org.gradle.daemon=true

# Run independent tasks in parallel — safe for most React Native projects
org.gradle.parallel=true

# Enable Gradle build cache to reuse outputs from previous builds
org.gradle.caching=true

# JVM memory settings (tweak based on your system RAM)
# -Xmx4096m = max heap memory (4 GB)
# -XX:MaxMetaspaceSize=1024m = memory for class metadata
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# =========================
# ✅ AndroidX Compatibility
# =========================

# Required for React Native and most modern Android libraries
android.useAndroidX=true
android.enableJetifier=true

# =========================
# ✅ React Native Settings
# =========================

# Specify supported architectures (adjust if needed)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Enable New Architecture (TurboModules & Fabric)
# Only set to true if you're using React Native 0.71+ and libraries that support new arch
newArchEnabled=true

# Use Hermes JS engine (better performance, smaller app size)
hermesEnabled=true

# =========================
# 📦 Optional Debug Tweaks
# =========================

# Enable to see more build logs in terminal (comment out if not needed)
# org.gradle.logging.level=info
# org.gradle.debug=true